name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  changes:
    name: detect-backend-changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend.yml"

  backend-tests:
    name: backend-tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecole_test
          POSTGRES_USER: ecole
          POSTGRES_PASSWORD: ecole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecole -d ecole_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ecole:ecole@localhost:5432/ecole_test
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-distinct-from-secret-key-32c

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        # --cov/--ds/etc. viennent déjà de pytest.ini (addopts) ; on ajoute
        # ici uniquement le rapport XML (artefact) et le seuil de couverture.
        run: pytest --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-security:
    name: backend-security
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    env:
      # Variables factices uniquement destinées à satisfaire `check --deploy`
      # avec les réglages de production (aucun secret réel, aucune base
      # réellement contactée par ce check).
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ci-only-fake-secret-key-with-plenty-of-length-and-unique-characters-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: example.test
      CORS_ALLOWED_ORIGINS: https://example.test
      DATABASE_URL: postgres://user:pass@localhost:5432/db
      JWT_SIGNING_KEY: ci-only-jwt-signing-key-distinct-from-secret-key-32c
      AUTH_COOKIE_SECURE: "True"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/security.txt

      - name: Install dependencies
        run: pip install -r requirements/security.txt

      - name: pip-audit (vulnérabilités connues)
        run: pip-audit -r requirements/base.txt

      - name: Bandit (analyse statique de sécurité)
        run: bandit -r apps config -ll

      - name: Django check --deploy (réglages de production)
        run: python manage.py check --deploy --fail-level WARNING
