version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  # Le frontend (package.json) vit actuellement à la racine du dépôt, pas
  # sous frontend/ (qui ne contient qu'un README) : voir le résumé du ticket
  # SCRUM-8 pour la remarque sur cette incohérence de structure héritée de
  # SCRUM-6.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
