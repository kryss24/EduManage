[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = tests
; --ds a la priorite la plus haute pour pytest-django (avant la variable
; d'environnement) : sans cela, DJANGO_SETTINGS_MODULE herite de .env
; (config.settings.dev, via env_file du service docker-compose) l'emporterait
; sur l'option ci-dessus, et les tests tourneraient avec les mauvais reglages
; (hashers lents, throttling reel actif, etc.) via `docker compose run --rm
; backend pytest`.
addopts = --ds=config.settings.test --cov=apps --cov-report=term-missing
